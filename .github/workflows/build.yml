name: build

# =============================================================================
# 整合进 InfiniteGUI-Minecraft-DLL 仓库后的编译流程：
#   1) dll      —— 直接编译本仓库的 InfiniteGUI-DLL.sln（Release|x64）
#                  里面已经整合了 AC / 搭路(Telly) / 蹲起塔 三个模块
#   2) injector —— 编译外置隐藏/绕过/注入器 ACTGInjector.exe（独立运行的程序）
#   3) package  —— 把 DLL + 注入器 + 说明打成一个包
#
# 触发：任何分支的 push / PR / 手动 workflow_dispatch
# =============================================================================

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CONFIG: Release
  PLATFORM: x64

jobs:
  # ---------------------------------------------------------------- DLL
  dll:
    name: DLL (AC + 搭路 + 蹲起塔)
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验三个模块是否已整合到位
        shell: pwsh
        run: |
          $mods = @(
            'InfiniteGUI-DLL\AcInputLink.h',
            'InfiniteGUI-DLL\InputSim.h',
            'InfiniteGUI-DLL\InputSim.cpp',
            'InfiniteGUI-DLL\AcClicker.h',
            'InfiniteGUI-DLL\AcClicker.cpp',
            'InfiniteGUI-DLL\Telly.h',
            'InfiniteGUI-DLL\Telly.cpp',
            'InfiniteGUI-DLL\SneakTower.h',
            'InfiniteGUI-DLL\SneakTower.cpp'
          )
          foreach ($f in $mods) {
            if (-not (Test-Path $f)) { throw "缺文件: $f" }
          }

          $im = Get-Content InfiniteGUI-DLL\ItemManager.cpp -Raw
          foreach ($k in @('AcClicker::Instance', 'Telly::Instance', 'SneakTower::Instance')) {
            if ($im -notmatch [regex]::Escape($k)) { throw "ItemManager.cpp 没有注册 $k" }
          }

          $pj = Get-Content InfiniteGUI-DLL\InfiniteGUI-DLL.vcxproj -Raw
          foreach ($k in @('AcClicker.cpp','Telly.cpp','SneakTower.cpp','InputSim.cpp','AcInputLink.h')) {
            if ($pj -notmatch [regex]::Escape($k)) { throw "vcxproj 里没有 $k" }
          }

          # 新模块必须带 UTF-8 BOM，否则 MSVC 按系统代码页解读 u8"中文"，界面会乱码
          foreach ($f in @('AcClicker.cpp','Telly.cpp','SneakTower.cpp','InputSim.cpp','AcInputLink.h')) {
            $b = [System.IO.File]::ReadAllBytes("InfiniteGUI-DLL\$f")
            if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) {
              throw "$f 缺 UTF-8 BOM"
            }
          }
          Write-Host '三个模块 + 注册 + 工程条目 + BOM 全部就位'

      - name: 配置 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 安装第三方依赖 (GLEW / nlohmann-json / stb)
        shell: pwsh
        run: |
          # 本工程依赖 GLEW / nlohmann-json / stb，README 说明需用户自行引入；
          # 这里用 runner 自带的 vcpkg 装好并放进工程目录，保证干净检出也能编过。
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { throw '找不到 VCPKG_INSTALLATION_ROOT' }
          & "$vcpkg\vcpkg.exe" install glew:x64-windows nlohmann-json:x64-windows stb:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install 失败 (exit $LASTEXITCODE)" }

          $inc = "$vcpkg\installed\x64-windows\include"
          $lib = "$vcpkg\installed\x64-windows\lib"
          # 整目录拷贝（含 nlohmann/detail 等子目录），并对 vcpkg 的目录布局做搜索兜底
          Copy-Item "$inc\nlohmann" InfiniteGUI-DLL\   -Recurse -Force
          $glSrc = if (Test-Path "$inc\GL") { "$inc\GL" } else { (Get-ChildItem $inc -Recurse -Directory -Filter 'GL' | Select-Object -First 1).FullName }
          if (-not $glSrc) { throw 'vcpkg 里找不到 GL 目录' }
          Copy-Item $glSrc InfiniteGUI-DLL\gl -Recurse -Force

          $stb = Get-ChildItem $inc -Recurse -Filter 'stb_image.h' | Select-Object -First 1
          if (-not $stb) { throw 'vcpkg 里找不到 stb_image.h' }
          Copy-Item $stb.FullName InfiniteGUI-DLL\ -Force

          $glib = Get-ChildItem $lib -Recurse -Filter 'glew32.lib' | Select-Object -First 1
          if (-not $glib) { throw 'vcpkg 里找不到 glew32.lib' }
          Copy-Item $glib.FullName InfiniteGUI-DLL\gl -Force
          $gdll = Get-ChildItem $lib -Recurse -Filter 'glew32.dll' | Select-Object -First 1
          if ($gdll) { Copy-Item $gdll.FullName InfiniteGUI-DLL\gl -Force }

          Write-Host "  工程 gl 目录: $((Get-ChildItem InfiniteGUI-DLL\gl -Recurse -File).Count) 个文件"
          Write-Host "  工程 nlohmann: $((Get-ChildItem InfiniteGUI-DLL\nlohmann -Recurse -File).Count) 个文件"
          Write-Host "  stb_image.h  : $(Test-Path InfiniteGUI-DLL\stb_image.h)"
          Write-Host '依赖已就位: InfiniteGUI-DLL/gl, InfiniteGUI-DLL/nlohmann, InfiniteGUI-DLL/stb_image.h'

      - name: 编译 ${{ env.CONFIG }}|${{ env.PLATFORM }}
        run: msbuild InfiniteGUI-DLL.sln /m /p:Configuration=${{ env.CONFIG }} /p:Platform=${{ env.PLATFORM }}

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter *.dll | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200

      - name: 上传 DLL
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteGUI-DLL-${{ env.PLATFORM }}-${{ env.CONFIG }}
          path: |
            **/*.dll
          if-no-files-found: error

  # ---------------------------------------------------------------- 外置程序
  injector:
    name: 外置隐藏/绕过/注入器
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 CMake
        run: cmake -S ACTGInjector -B build-injector -A ${{ env.PLATFORM }} -DCMAKE_BUILD_TYPE=${{ env.CONFIG }}

      - name: 编译
        run: cmake --build build-injector --config ${{ env.CONFIG }}

      - name: 上传注入器
        uses: actions/upload-artifact@v4
        with:
          name: ACTGInjector-${{ env.PLATFORM }}
          path: build-injector/out/ACTGInjector.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- 打包
  package:
    name: 打包（DLL + 外置程序）
    runs-on: windows-latest
    needs: [dll, injector]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载两个产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 组装发布包
        shell: pwsh
        run: |
          $out = 'dist/InfiniteGUI-AC-Telly'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem -Recurse dist -Filter *.dll      | ForEach-Object { Copy-Item $_.FullName $out -Force }
          Get-ChildItem -Recurse dist -Filter ACTGInjector.exe | ForEach-Object { Copy-Item $_.FullName $out -Force }
          Copy-Item README-ac-telly.md $out -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$out/docs" | Out-Null
          Copy-Item docs\ac-telly-*.md "$out/docs" -Force -ErrorAction SilentlyContinue
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 160

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteGUI-AC-Telly-${{ env.PLATFORM }}
          path: dist/InfiniteGUI-AC-Telly/**
          if-no-files-found: error